spring:
  datasource:
    url: jdbc:h2:mem:traceflow-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  threads:
    virtual:
      enabled: false

traceflow:
  storage-dir: ./target/test-storage
  demo:
    seed-on-startup: false
  retention:
    enabled: false

logging:
  level:
    dev.traceflow: WARN
    org.springframework: WARN
    org.hibernate: WARN
