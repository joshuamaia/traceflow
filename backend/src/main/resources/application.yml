spring:
  application:
    name: traceflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/traceflow}
    username: ${DB_USER:traceflow}
    password: ${DB_PASSWORD:traceflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations - Hibernate never alters it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${TRACEFLOW_MAX_FILE_SIZE:50MB}
      max-request-size: ${TRACEFLOW_MAX_REQUEST_SIZE:200MB}
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

traceflow:
  storage-dir: ${TRACEFLOW_STORAGE_DIR:./data/uploads}
  # When true, persistent imports are disabled (no authentication exists yet). Demo scenarios and the
  # ephemeral analyzer remain available.
  public-mode: ${TRACEFLOW_PUBLIC_MODE:false}
  imports:
    max-file-size: ${TRACEFLOW_MAX_FILE_SIZE:50MB}
    max-files: ${TRACEFLOW_MAX_FILES:10}
    allowed-extensions: log,txt,json,jsonl
    batch-size: 500
    max-paste-size: 2MB
  parsing:
    default-zone: ${TRACEFLOW_DEFAULT_ZONE:UTC}
    max-events-per-trace-detail: 5000
  retention:
    enabled: ${TRACEFLOW_RETENTION_ENABLED:true}
    days: ${TRACEFLOW_RETENTION_DAYS:30}
    cron: "0 0 3 * * *"
  demo:
    seed-on-startup: ${TRACEFLOW_DEMO_SEED:true}
    max-runs-kept: 200
  cors:
    allowed-origins: ${TRACEFLOW_CORS_ORIGINS:http://localhost:4200}

logging:
  level:
    root: INFO
    dev.traceflow: INFO
    org.hibernate.SQL: WARN
